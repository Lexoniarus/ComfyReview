name: C1 Formatter Diagnostics

on:
  push:
    branches:
      - feature/character-lab-comfyreview

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install repository-pinned Ruff
        run: python -m pip install ruff==0.16.9
      - name: Show exact C1 formatter diff
        run: |
          python -m ruff format --diff \
            comfyreview/providers/character_catalog_files.py \
            tests/test_character_catalog.py
