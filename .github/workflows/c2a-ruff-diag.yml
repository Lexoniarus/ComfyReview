name: C2a Ruff Formatting Diagnostics (temporary)

on:
  push:
    paths:
      - ".github/workflows/c2a-ruff-diag.yml"

permissions:
  contents: read

jobs:
  formatting-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.9

      - name: Print exact formatter differences
        run: |
          python -m ruff format --diff \
            comfyreview/providers/character_prompt_files.py \
            quality/architecture.py \
            tests/test_architecture.py \
            tests/test_character_prompts.py || true
          echo "END_C2A_FORMAT_DIAGNOSTICS"
