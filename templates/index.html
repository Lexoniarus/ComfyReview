{% extends "_v2_base.html" %} {% set page_title = "Prüfen · ComfyReview" %}
{% set active_nav = "review" %} {% block styles %}
<link rel="stylesheet" href="/static/css/v2/image-surfaces.css" />
<link rel="stylesheet" href="/static/css/v2/review.css" />
{% endblock %} {% block content %}
<div class="review-shell" data-v2-surface="review">
  <aside
    class="v2-panel review-scope"
    id="review-scope"
    data-scope-navigator
    aria-label="Bildbereiche"
  ></aside>

  <section class="review-main" aria-labelledby="review-title">
    <header class="v2-panel review-toolbar">
      <div class="review-title-group">
        <button
          class="rail-toggle"
          type="button"
          data-rail-action="scope"
          aria-controls="review-scope"
          aria-expanded="false"
        >
          Bereiche
        </button>
        <h1 id="review-title">Prüfen</h1>
        <span class="review-status" data-review-status aria-live="polite"
          >Nächstes Bild wird geladen …</span
        >
      </div>
      <button
        class="rail-toggle"
        type="button"
        data-rail-action="inspector"
        aria-controls="review-inspector"
        aria-expanded="false"
      >
        Details
      </button>
    </header>
    <div class="active-scopes" data-active-scopes hidden></div>
    <div class="review-stage" data-review-stage aria-live="polite"></div>
  </section>

  <aside
    class="v2-panel review-inspector"
    id="review-inspector"
    data-image-inspector
    aria-label="Bilddetails"
  >
    <p class="inspector-status">Bilddetails werden geladen …</p>
  </aside>

  <dialog class="image-viewer" data-image-viewer aria-label="Bildansicht">
    <button
      class="icon-button"
      type="button"
      data-viewer-close
      aria-label="Bildansicht schließen"
    >
      ×
    </button>
    <img alt="Vergrößerte Bildansicht" />
  </dialog>

  <dialog class="confirm-dialog" data-confirm-dialog>
    <form method="dialog">
      <h2>Bild löschen?</h2>
      <p data-confirm-message></p>
      <div class="confirm-actions">
        <button type="button" data-confirm-result="cancel">Abbrechen</button>
        <button
          class="danger-button"
          type="button"
          data-confirm-result="confirm"
        >
          Löschen
        </button>
      </div>
    </form>
  </dialog>
</div>
{% endblock %} {% block scripts %}
<script type="module" src="/static/js/entries/review.js"></script>
{% endblock %}
