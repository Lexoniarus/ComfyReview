{% extends "_v2_base.html" %} {% set page_title = "Arena · ComfyReview" %}
{% set active_nav = "arena" %} {% block styles %}
<link rel="stylesheet" href="/static/css/v2/image-surfaces.css" />
<link rel="stylesheet" href="/static/css/v2/arena.css" />
{% endblock %} {% block content %}
<div class="arena-shell" data-v2-surface="arena">
  <aside
    class="v2-panel arena-scope"
    data-scope-navigator
    aria-label="Bildbereiche"
  ></aside>

  <section class="arena-main" aria-labelledby="arena-title">
    <header class="v2-panel arena-toolbar">
      <div class="arena-title-group">
        <button
          class="rail-toggle"
          type="button"
          data-rail-action="scope"
          aria-expanded="false"
        >
          Bereiche
        </button>
        <h1 id="arena-title">Arena</h1>
        <span class="arena-status" data-arena-status aria-live="polite"
          >Paar wird geladen …</span
        >
      </div>
      <button
        class="rail-toggle"
        type="button"
        data-rail-action="inspector"
        aria-expanded="false"
      >
        Details
      </button>
    </header>
    <div class="active-scopes" data-active-scopes hidden></div>
    <div class="arena-board" data-arena-board aria-live="polite"></div>
  </section>

  <aside
    class="v2-panel arena-inspector"
    data-image-inspector
    aria-label="Bilddetails"
  >
    <p class="inspector-status">Wähle Bild A oder B für Details.</p>
  </aside>

  <dialog class="image-viewer" data-image-viewer aria-label="Bildansicht">
    <button
      class="icon-button"
      type="button"
      data-viewer-close
      aria-label="Bildansicht schließen"
    >
      ×
    </button>
    <img alt="Vergrößerte Bildansicht" />
  </dialog>
</div>
{% endblock %} {% block scripts %}
<script type="module" src="/static/js/entries/arena.js"></script>
{% endblock %}
