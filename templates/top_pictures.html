{% extends "_v2_base.html" %} {% set page_title = "Top / Worst · ComfyReview" %}
{% set active_nav = "ranking" %} {% block styles %}
<link rel="stylesheet" href="/static/css/v2/top-worst.css" />
{% endblock %} {% block content %}
<div class="ranking-shell" data-v2-surface="top-worst">
  <aside
    class="v2-panel ranking-scope"
    data-scope-navigator
    aria-label="Bildbereiche"
  ></aside>

  <section class="ranking-main" aria-labelledby="ranking-title">
    <header class="v2-panel ranking-toolbar">
      <div class="ranking-title-group">
        <button
          class="rail-toggle"
          type="button"
          data-surface-action="toggle-scopes"
          aria-expanded="false"
        >
          Bereiche
        </button>
        <h1 id="ranking-title">Top / Worst</h1>
        <span class="result-count" data-result-count aria-live="polite"
          >Bilder werden geladen …</span
        >
      </div>
      <div class="ranking-actions">
        <div class="mode-switch" aria-label="Rankingmodus">
          <button type="button" data-surface-action="top" aria-pressed="true">
            Top
          </button>
          <button
            type="button"
            data-surface-action="worst"
            aria-pressed="false"
          >
            Worst
          </button>
        </div>
        <button
          class="rail-toggle"
          type="button"
          data-surface-action="toggle-inspector"
          aria-expanded="false"
        >
          Details
        </button>
      </div>
    </header>
    <div class="active-scopes" data-active-scopes hidden></div>
    <div class="image-grid" data-image-grid aria-live="polite"></div>
    <nav class="pagination" data-pagination aria-label="Galerieseiten"></nav>
  </section>

  <aside
    class="v2-panel ranking-inspector"
    data-image-inspector
    aria-label="Bilddetails"
  >
    <p class="inspector-status">Wähle ein Bild aus, um Details zu sehen.</p>
  </aside>

  <dialog class="image-viewer" data-image-viewer aria-label="Bildansicht">
    <button
      class="icon-button"
      type="button"
      data-viewer-close
      aria-label="Bildansicht schließen"
    >
      ×
    </button>
    <img alt="Vergrößerte Bildansicht" />
  </dialog>
</div>
{% endblock %} {% block scripts %}
<script type="module" src="/static/js/entries/top-worst.js"></script>
{% endblock %}
